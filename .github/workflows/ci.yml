name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Кэш uv-зависимостей шарим между запусками по ключу uv.lock — это
# существенно сокращает время «холодного» install.
env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-and-test:
    name: Lint, type-check, tests
    runs-on: ubuntu-latest

    # БД и Redis нужны конкретным интеграционным тестам и для проверки,
    # что миграции применяются. Юнит-тесты сами по себе не ходят в БД,
    # но conftest требует валидных env-переменных (см. tests/conftest.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whoiswatcher
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: whoiswatcher
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Black format check
        run: uv run black --check src tests

      - name: Mypy type check
        run: uv run mypy src

      - name: Pytest
        # Минимальный набор env-переменных, чтобы pydantic-settings не падал
        # на отсутствии обязательных полей. Конкретные тесты ходят в БД
        # только если им это нужно — большинство юнит-тестов про БД мокает.
        # ARQ integration (TASK-0052) now uses real services (github services in CI, pytest-docker locally).
        env:
          BOT_TOKEN: "test:ci-bot-token"
          WEBHOOK_BASE_URL: "https://ci.example.com"
          WEBHOOK_SECRET: "ci-webhook-secret"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          POSTGRES_USER: "whoiswatcher"
          POSTGRES_PASSWORD: "testpass"
          POSTGRES_DB: "whoiswatcher"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          ENVIRONMENT: "development"
        run: uv run pytest -v

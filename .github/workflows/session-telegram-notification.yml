name: Session Log → Telegram

on:
  push:
    branches: [main]
    paths:
      - 'SESSION_LOG.md'

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest session
        id: get_log
        run: |
          LOG=$(head -n 35 SESSION_LOG.md)
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send notification to Telegram
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Plain text: session log entries содержат technic content
          # типа dnspython>=2.6,<3, list[int], `code`, *emphasis* —
          # HTML/Markdown парсы ломаются на разной комбинации спец-
          # символов. Plain text устойчив ко всему. Markdown/HTML
          # разметка в самом message-шаблоне убрана, чтобы не светилась
          # литералами.
          format: ""
          message: |
            ✅ Новая сессия Claude Code

            ${{ steps.get_log.outputs.log }}

            Полный журнал: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/SESSION_LOG.md

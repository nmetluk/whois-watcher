name: Sync metadata to Gist

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'TODO.md'
      - 'SESSION_LOG.md'
      - 'CHANGELOG.md'
      - 'docs/decisions.md'
      - 'PROMPT_FOR_CLAUDE.md'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Sync files to gist via GitHub API
        env:
          GIST_TOKEN: ${{ secrets.GIST_SYNC_TOKEN }}
          GIST_ID: ${{ secrets.GIST_SYNC_ID }}
        run: |
          set -euo pipefail

          # Payload пишем в файл: combined-size 6 mirror-файлов растёт
          # выше ARG_MAX (~128 KB), inline -d "$payload" падает с
          # "Argument list too long". --data-binary @file читает stdin,
          # argv остаётся маленьким.
          payload_file=$(mktemp)
          trap 'rm -f "$payload_file"' EXIT

          jq -n \
            --rawfile claude CLAUDE.md \
            --rawfile todo TODO.md \
            --rawfile session SESSION_LOG.md \
            --rawfile changelog CHANGELOG.md \
            --rawfile decisions docs/decisions.md \
            --rawfile prompt PROMPT_FOR_CLAUDE.md \
            '{
              "files": {
                "CLAUDE.md":            {"content": $claude},
                "TODO.md":              {"content": $todo},
                "SESSION_LOG.md":       {"content": $session},
                "CHANGELOG.md":         {"content": $changelog},
                "decisions.md":         {"content": $decisions},
                "PROMPT_FOR_CLAUDE.md": {"content": $prompt}
              }
            }' > "$payload_file"

          response=$(curl -sS -w "\n%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$payload_file" \
            "https://api.github.com/gists/$GIST_ID")

          status=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)

          if [ "$status" != "200" ]; then
            echo "::error::Gist update failed with HTTP $status"
            echo "$body" | head -50
            exit 1
          fi

          echo "✅ Gist updated successfully"
          echo "URL: https://gist.github.com/nmetluk/$GIST_ID"

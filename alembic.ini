# Конфигурация Alembic для async SQLAlchemy.
# DSN берётся из src/config/settings.py (см. migrations/env.py).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
timezone = UTC

# Имена ревизий: YYYYMMDD_HHMM_<slug>
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# DSN специально не задаём здесь — настоящий URL подставляется в env.py
# из настроек проекта (pydantic-settings).
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
hooks = black, ruff
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------
# Логирование
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

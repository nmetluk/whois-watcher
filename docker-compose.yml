name: whois-watcher

services:
  postgres:
    image: postgres:16-alpine
    container_name: ww-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whoiswatcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-whoiswatcher}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whoiswatcher} -d ${POSTGRES_DB:-whoiswatcher}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ww-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: whois-watcher:latest
    container_name: ww-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["python", "-m", "src.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    # ADR 028: WHOIS-прокси работает на хосте (не в Docker); пробрасываем
    # имя host.docker.internal в /etc/hosts контейнера, чтобы lookup_via_proxy
    # мог достучаться по http://host.docker.internal:8043.
    extra_hosts:
      - "host.docker.internal:172.28.0.1"
    ports:
      - "127.0.0.1:${WEBHOOK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: whois-watcher:latest
    container_name: ww-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["python", "-m", "src.worker"]
    depends_on:
      bot:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    # ADR 028: см. комментарий в сервисе bot.
    extra_hosts:
      - "host.docker.internal:172.28.0.1"
    # ADR 042: том для pg_dump бекапов (монтируется на BACKUP_DIR=/backups)
    volumes:
      - backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    image: whois-watcher:latest
    container_name: ww-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ARQ_MODE: scheduler
    command: ["python", "-m", "src.worker", "--scheduler"]
    depends_on:
      bot:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    # ADR 028: см. комментарий в сервисе bot.
    extra_hosts:
      - "host.docker.internal:172.28.0.1"
    # ADR 042: том для pg_dump бекапов (монтируется на BACKUP_DIR=/backups).
    # Бекапы пишет именно scheduler (cron'ы в нём).
    volumes:
      - backups:/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
    name: ww_postgres_data
  redis_data:
    name: ww_redis_data
  backups:
    name: ww_backups

networks:
  internal:
    name: ww_internal
    driver: bridge
    # ADR 028: фиксируем subnet чтобы захардкодить host.docker.internal
    # на gateway этой сети (172.28.0.1). Docker-magic ``host-gateway``
    # резолвится в IP default docker0 (172.17.0.1), на котором наши
    # сервисы не сидят — пакеты теряются. Под subnet также добавляется
    # ufw allow на хосте (см. docs/decisions.md ADR 028).
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

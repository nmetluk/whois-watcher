[project]
name = "whois-watcher"
version = "0.5.0"
description = "Telegram-бот для проверки WHOIS-данных доменов и напоминаний об их истечении."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"
authors = [
    { name = "Nikolay Metluk" },
]
keywords = ["telegram", "bot", "whois", "rdap", "domains", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
]

dependencies = [
    # Telegram bot framework
    "aiogram>=3.4,<4.0",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    # Task queue
    "arq>=0.26,<1.0",
    "redis>=5.0,<6.0",
    # WHOIS / RDAP
    "whoisit>=3.0,<4.0",
    "python-whois>=0.9,<1.0",
    "idna>=3.6,<4.0",
    # Config & validation
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    # Logging & monitoring
    "structlog>=24.1,<25.0",
    "sentry-sdk>=2.0,<3.0",
    # Webhook server
    "aiohttp>=3.9,<4.0",
    # JSON
    "orjson>=3.9,<4.0",
    "python-dateutil>=2.9,<3.0",
]

[project.urls]
Homepage = "https://github.com/nmetluk/whois-watcher"
Repository = "https://github.com/nmetluk/whois-watcher"
Issues = "https://github.com/nmetluk/whois-watcher/issues"

[dependency-groups]
# Диапазоны умышленно широкие (<X+1.0): сторонние tooling-пакеты выпускают
# совместимые минорные релизы регулярно, и слишком жёсткие верхние границы
# заставляют каждый раз вручную выпускать обновление зависимостей. Lockfile
# (``uv.lock``) фиксирует точные версии для воспроизводимых сборок.
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.30",
    "pytest-cov>=4.0,<7.0",
    "black>=24.0,<26.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.9,<2.0",
    "pre-commit>=3.0,<5.0",
    "detect-secrets>=1.4,<2.0",
    "types-redis>=4.0",
    "types-python-dateutil>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.venv
  | migrations/versions
)/
'''

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async-specific lints
]
ignore = [
    "E501",   # line length (handled by black)
    "B008",   # function calls in default args (FastAPI/aiogram pattern)
    "RUF001", # ambiguous unicode in strings — bilingual project (RU/EN)
    "RUF002", # ambiguous unicode in docstrings — bilingual project (RU/EN)
    "RUF003", # ambiguous unicode in comments — bilingual project (RU/EN)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802", "N803"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "whoisit.*",
    "whois.*",
    "arq.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "unit: unit tests",
    "integration: integration tests (require docker services)",
    "slow: tests that take noticeable time",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:aiogram.*",
    "ignore::DeprecationWarning:pydantic.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/main.py",
    "src/worker.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

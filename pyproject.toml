[project]
name = "whois-watcher"
version = "0.1.0"
description = "Telegram-бот для проверки WHOIS-данных доменов и напоминаний об их истечении."
authors = [
    { name = "Whois Watcher Contributors" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["telegram", "bot", "whois", "rdap", "domains", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
]

dependencies = [
    # Telegram bot framework
    "aiogram (>=3.4,<4.0)",
    # Database
    "sqlalchemy[asyncio] (>=2.0,<3.0)",
    "asyncpg (>=0.29,<1.0)",
    "alembic (>=1.13,<2.0)",
    # Task queue
    "arq (>=0.26,<1.0)",
    "redis (>=5.0,<6.0)",
    # WHOIS / RDAP
    "whoisit (>=3.0,<4.0)",
    "python-whois (>=0.9,<1.0)",
    "idna (>=3.6,<4.0)",
    # Config & validation
    "pydantic (>=2.6,<3.0)",
    "pydantic-settings (>=2.2,<3.0)",
    # Logging & monitoring
    "structlog (>=24.1,<25.0)",
    "sentry-sdk (>=2.0,<3.0)",
    # Webhook server
    "aiohttp (>=3.9,<4.0)",
    # JSON
    "orjson (>=3.9,<4.0)",
]

[project.optional-dependencies]
dev = []

[project.urls]
Homepage = "https://github.com/your-org/whois-watcher"
Repository = "https://github.com/your-org/whois-watcher"
Issues = "https://github.com/your-org/whois-watcher/issues"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
black = "^24.3"
ruff = "^0.3"
mypy = "^1.9"
pre-commit = "^3.6"
detect-secrets = "^1.4"
types-redis = "^4.6"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.venv
  | migrations/versions
)/
'''

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async-specific lints
]
ignore = [
    "E501",   # line length (handled by black)
    "B008",   # function calls in default args (FastAPI/aiogram pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N802", "N803"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "whoisit.*",
    "whois.*",
    "arq.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "unit: unit tests",
    "integration: integration tests (require docker services)",
    "slow: tests that take noticeable time",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:aiogram.*",
    "ignore::DeprecationWarning:pydantic.*",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/main.py",
    "src/worker.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

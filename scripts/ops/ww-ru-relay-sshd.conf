# Install on the RU relay as /etc/ssh/sshd_config.d/60-ww-ru-relay.conf.
# The account can forward to local WHOIS only; no shell or reverse forwards.
Match User ww-ru-relay
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:43
    AllowStreamLocalForwarding no
    PermitTunnel no
    MaxSessions 0
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
Match all

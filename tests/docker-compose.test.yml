version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: whoiswatcher
      POSTGRES_PASSWORD: test-postgres-password
      POSTGRES_DB: whoiswatcher
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoiswatcher"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7
    ports:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
